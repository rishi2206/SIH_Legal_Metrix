spring.application.name=interconn-backend
server.port=${PORT:8080}

# Supabase PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/interconn_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Supabase Storage Parameters
supabase.url=${SUPABASE_URL:https://xyzcompany.supabase.co}
supabase.key=${SUPABASE_KEY:dummy-supabase-key}
supabase.storage.bucket.evidence=${SUPABASE_STORAGE_BUCKET_EVIDENCE:evidence-images}
supabase.storage.bucket.reports=${SUPABASE_STORAGE_BUCKET_REPORTS:reports}

# JWT Authentication Security Config
jwt.secret=${JWT_SECRET:interconn-super-secret-key-change-this-before-production-123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# AI Microservice (FastAPI: OpenCV + PaddleOCR + Gemini)
ai.service.base-url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.connect-timeout-ms=${AI_SERVICE_CONNECT_TIMEOUT_MS:5000}
ai.service.read-timeout-ms=${AI_SERVICE_READ_TIMEOUT_MS:180000}
ocr.provider=${OCR_PROVIDER:ai-service}

# Production CORS Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://10.0.2.2:8080,http://localhost:8080}

# File Upload Limits & Safety
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB