# H2 In-Memory Database Configuration for Unit & Integration Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Supabase Storage Mock / Test Config
supabase.url=https://xyzcompany.supabase.co
supabase.key=dummy-supabase-key

# JWT Test Secret
jwt.secret=interconn-super-secret-key-change-this-before-production-123456789
jwt.expiration=86400000

# AI Test Config
ai.service.base-url=http://localhost:8000
ocr.provider=mock
